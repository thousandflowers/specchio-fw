; Copy to secrets.ini (gitignored) and fill in. Values are compiled into the firmware.
[secrets]
build_flags =
  '-DOTA_PASS="change-me-8+chars"'   ; /update, /api/config and the specchio-setup AP
  '-DHOMEKIT_CODE="000-00-000"'      ; HomeKit pairing code, format XXX-XX-XXX
  '-DWIFI_SSID="your-network"'       ; used only until the strip has joined Wi-Fi once
  '-DWIFI_PASS="your-password"'
; '-DGOOD_FW_MD5="0123456789abcdef0123456789abcdef"'  ; optional: md5 of the known-good image the self-restore guard may install
; '-DNTP_FALLBACK="192.168.1.1"'      ; optional: a time server on your own network, e.g. the router
