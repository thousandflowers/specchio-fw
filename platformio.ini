; Firmware for the Athom LS5050C-HK RGB strip controller ("specchio").
; Platform 2.6.3 = Arduino core 2.7.4, the exact core the stock Athom firmware
; was built with, and the one HomeKit-ESP8266 1.2.0 targets. With no serial
; port wired on the device, "known to boot on this chip" beats "newest".
[platformio]
extra_configs = secrets.ini

[env:specchio]
platform = espressif8266@2.6.3
board = esp_wroom_02
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dout
; same flash layout as stock (sketch up to 0x1E0000, FS 108 KB, HomeKit keys at 0x1FB000)
board_build.ldscript = eagle.flash.2m128.ld
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
  -DSELF_RESTORE
  ${secrets.build_flags}
lib_deps = mixiaoxiao/HomeKit-ESP8266@1.2.0
