; Firmware for the Athom LS5050C-HK RGB strip ("specchio").
; Core 2.7.4 = same Arduino core the stock Athom firmware was built with.
[env:specchio]
platform = espressif8266@2.6.3
board = esp_wroom_02
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.2m64.ld
build_flags = -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
lib_deps = mixiaoxiao/HomeKit-ESP8266@^1.2.0
monitor_speed = 115200
